# Limitation de débit sur les formulaires sensibles : 30 envois/minute par IP, rafale de 10.
# Au-delà : HTTP 429. Flask-Limiter applique en plus ses propres seuils (deux barrières).
# Seuls les POST sont comptés (clé vide = non limité) : afficher la page de connexion ne consomme rien.
map $request_method $auth_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $auth_limit_key zone=authzone:10m rate=30r/m;

# HTTP : on ne sert rien, on redirige tout vers HTTPS
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

# HTTPS : terminaison TLS puis transmission à Flask (réseau interne Docker)
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;     # SSLv3 / TLS 1.0 / 1.1 refusés
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;

    server_tokens off;                        # masque la version de Nginx
    client_max_body_size 2m;

    # En-têtes de sécurité (vérifiables avec curl -I ou les outils développeur)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # HSTS : le navigateur n'ouvrira plus ce site qu'en HTTPS. Durée volontairement COURTE (5 minutes) :
    # sur « localhost », HSTS vaut pour tous les ports et tous vos projets locaux. En production,
    # passer à max-age=31536000; includeSubDomains une fois HTTPS maîtrisé.
    add_header Strict-Transport-Security "max-age=300" always;

    # Formulaires sensibles : limitation de débit (429 au-delà du seuil)
    location ~ ^/auth/(login|register|password)$ {
        limit_req zone=authzone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Dépôt de fichier (PDF, DOC, DOCX : 8 Mo au plus côté application) : seule page qui accepte plus de 2 Mo
    location = /documents/upload {
        client_max_body_size 10m;

        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # IP réelle uniquement : un client ne peut pas injecter une fausse IP
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
